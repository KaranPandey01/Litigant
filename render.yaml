services:
  - type: web
    name: litigant-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        value: sqlite:///./litigant.db
      - key: CORS_ORIGINS
        value: "*"
      - key: MIN_VIABLE_RECOVERY_INR
        value: "50"
    healthCheckPath: /health

  - type: web
    name: litigant-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false